<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf1fb"/>
      <stop offset="1" stop-color="#f6f8fc"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2aabee"/>
      <stop offset="1" stop-color="#229ed9"/>
    </linearGradient>
  </defs>

  <rect width="1240" height="860" fill="url(#bg)"/>

  <!-- title -->
  <text x="620" y="56" text-anchor="middle" font-size="32" font-weight="700" fill="#0f1b2d">Daily OS Bot — live demo</text>
  <text x="620" y="88" text-anchor="middle" font-size="17" fill="#5b6b80">An AI ops assistant on Telegram that auto-tracks a real job search from the inbox</text>

  <!-- ============ PHONE 1: auto-tracking ============ -->
  <g transform="translate(60,130)">
    <rect x="6" y="8" width="340" height="600" rx="30" fill="#0f1b2d" opacity="0.08"/>
    <rect width="340" height="600" rx="30" fill="#ffffff"/>
    <!-- header -->
    <path d="M0,30 a30,30 0 0 1 30,-30 h280 a30,30 0 0 1 30,30 v34 h-340 z" fill="url(#hdr)"/>
    <circle cx="34" cy="32" r="15" fill="#ffffff" opacity="0.9"/>
    <text x="34" y="37" text-anchor="middle" font-size="15">🐶</text>
    <text x="60" y="29" font-size="15" font-weight="700" fill="#ffffff">Robosebby</text>
    <text x="60" y="47" font-size="11" fill="#dff1fb">bot</text>

    <!-- chat area -->
    <rect x="0" y="64" width="340" height="536" fill="#eef3f8"/>

    <!-- logged-application bubbles -->
    <rect x="16" y="84" width="300" height="58" rx="16" fill="#ffffff"/>
    <text x="32" y="107" font-size="14.5" font-weight="600" fill="#1c2430">🆕 Logged application <tspan fill="#8a97a8" font-weight="400">(auto)</tspan></text>
    <text x="32" y="129" font-size="14.5" fill="#1c2430">Reddit — Analytics Engineer</text>

    <rect x="16" y="150" width="300" height="58" rx="16" fill="#ffffff"/>
    <text x="32" y="173" font-size="14.5" font-weight="600" fill="#1c2430">🆕 Logged application <tspan fill="#8a97a8" font-weight="400">(auto)</tspan></text>
    <text x="32" y="195" font-size="14.5" fill="#1c2430">GitHub — Data Analyst II</text>

    <rect x="16" y="216" width="300" height="58" rx="16" fill="#ffffff"/>
    <text x="32" y="239" font-size="14.5" font-weight="600" fill="#1c2430">🆕 Logged application <tspan fill="#8a97a8" font-weight="400">(auto)</tspan></text>
    <text x="32" y="261" font-size="14.5" fill="#1c2430">Metropolis — Sr. Data Analyst</text>

    <!-- positive status change (green) -->
    <rect x="16" y="282" width="300" height="84" rx="16" fill="#e6f6ea"/>
    <text x="32" y="308" font-size="14.5" font-weight="600" fill="#1f7a3d">📞 Affirm — Data Analyst:</text>
    <text x="32" y="329" font-size="14.5" fill="#1c2430">now Recruiter Screen</text>
    <text x="32" y="352" font-size="12.5" fill="#2a6ed4">↳ opens the Gmail thread</text>

    <!-- rejection status change (red) -->
    <rect x="16" y="378" width="300" height="84" rx="16" fill="#fdeceb"/>
    <text x="32" y="404" font-size="14.5" font-weight="600" fill="#b3261e">❌ DoorDash — Associate:</text>
    <text x="32" y="425" font-size="14.5" fill="#1c2430">now Rejected</text>
    <text x="32" y="448" font-size="12.5" fill="#2a6ed4">↳ opens the Gmail thread</text>

    <text x="170" y="496" text-anchor="middle" font-size="12.5" fill="#8a97a8">…within an hour of each email</text>
  </g>
  <text x="230" y="775" text-anchor="middle" font-size="15.5" font-weight="600" fill="#0f1b2d">Detected &amp; logged from Gmail</text>
  <text x="230" y="797" text-anchor="middle" font-size="13.5" fill="#5b6b80">zero manual status updates</text>

  <!-- ============ PHONE 2: digest + correction ============ -->
  <g transform="translate(450,130)">
    <rect x="6" y="8" width="340" height="600" rx="30" fill="#0f1b2d" opacity="0.08"/>
    <rect width="340" height="600" rx="30" fill="#ffffff"/>
    <path d="M0,30 a30,30 0 0 1 30,-30 h280 a30,30 0 0 1 30,30 v34 h-340 z" fill="url(#hdr)"/>
    <circle cx="34" cy="32" r="15" fill="#ffffff" opacity="0.9"/>
    <text x="34" y="37" text-anchor="middle" font-size="15">🐶</text>
    <text x="60" y="29" font-size="15" font-weight="700" fill="#ffffff">Robosebby</text>
    <text x="60" y="47" font-size="11" fill="#dff1fb">bot</text>
    <rect x="0" y="64" width="340" height="536" fill="#eef3f8"/>

    <!-- user request (right, green) -->
    <rect x="40" y="86" width="284" height="86" rx="16" fill="#d6f5cd"/>
    <text x="58" y="112" font-size="14" fill="#15351a">Add a task to prep &amp; set up the</text>
    <text x="58" y="133" font-size="14" fill="#15351a">8 meetings Dan sent — block</text>
    <text x="58" y="154" font-size="14" fill="#15351a">~11am tomorrow</text>

    <!-- bot: task created (auto-enriched) -->
    <rect x="16" y="186" width="308" height="92" rx="16" fill="#ffffff"/>
    <text x="32" y="212" font-size="14.5" fill="#1c2430">✓ Task created:</text>
    <text x="32" y="234" font-size="14.5" font-weight="700" fill="#1c2430">Prep &amp; Set Up 8 Meetings</text>
    <text x="32" y="256" font-size="14.5" font-weight="700" fill="#1c2430">(from Dan) <tspan font-weight="400" fill="#b3261e">⚡ High energy</tspan></text>

    <!-- bot: time-blocked -->
    <rect x="16" y="292" width="308" height="92" rx="16" fill="#ffffff"/>
    <text x="32" y="318" font-size="14.5" fill="#1c2430">✓ Time-blocked Tue, Jun 16</text>
    <text x="32" y="340" font-size="14.5" font-weight="700" fill="#1c2430">11:00 – 11:50 AM</text>
    <text x="32" y="362" font-size="14.5" fill="#1c2430">prep &amp; setup — you're all set 🎯</text>

    <text x="170" y="426" text-anchor="middle" font-size="12.5" fill="#8a97a8">one ask, no back-and-forth</text>
  </g>
  <text x="620" y="775" text-anchor="middle" font-size="15.5" font-weight="600" fill="#0f1b2d">Capture → enrich → protect time</text>
  <text x="620" y="797" text-anchor="middle" font-size="13.5" fill="#5b6b80">a task, auto-tagged, with a calendar block</text>

  <!-- ============ PHONE 3: morning briefing ============ -->
  <g transform="translate(840,130)">
    <rect x="6" y="8" width="340" height="600" rx="30" fill="#0f1b2d" opacity="0.08"/>
    <rect width="340" height="600" rx="30" fill="#ffffff"/>
    <path d="M0,30 a30,30 0 0 1 30,-30 h280 a30,30 0 0 1 30,30 v34 h-340 z" fill="url(#hdr)"/>
    <circle cx="34" cy="32" r="15" fill="#ffffff" opacity="0.9"/>
    <text x="34" y="37" text-anchor="middle" font-size="15">🐶</text>
    <text x="60" y="29" font-size="15" font-weight="700" fill="#ffffff">Robosebby</text>
    <text x="60" y="47" font-size="11" fill="#dff1fb">bot</text>
    <rect x="0" y="64" width="340" height="536" fill="#eef3f8"/>

    <rect x="16" y="90" width="308" height="430" rx="16" fill="#ffffff"/>
    <text x="32" y="120" font-size="15.5" font-weight="700" fill="#1c2430">🌅 Morning Briefing</text>
    <text x="32" y="140" font-size="12.5" fill="#8a97a8">Friday, June 12</text>

    <text x="32" y="174" font-size="14" font-weight="700" fill="#caa100">⚡ High Energy</text>
    <text x="32" y="195" font-size="13.5" fill="#3a4658">Nothing today — clear runway.</text>

    <text x="32" y="231" font-size="14" font-weight="700" fill="#3e8e41">🔋 Medium Energy</text>
    <text x="32" y="252" font-size="13.5" fill="#3a4658">• Write one STAR story bullet 🎤</text>
    <text x="32" y="273" font-size="13.5" fill="#3a4658">• Pick a data/AI course 🧠</text>

    <text x="32" y="309" font-size="14" font-weight="700" fill="#b06a2c">🪫 Low Energy / Admin</text>
    <text x="32" y="330" font-size="13.5" fill="#3a4658">• Text one date idea ❤️</text>
    <text x="32" y="351" font-size="13.5" fill="#3a4658">• Set up a Spanish app 🗣️</text>

    <text x="32" y="387" font-size="14" font-weight="700" fill="#b3261e">🔴 Stale — waiting too long</text>
    <text x="32" y="408" font-size="13.5" fill="#3a4658">2 tasks rolled 4 days. Knock</text>
    <text x="32" y="429" font-size="13.5" fill="#3a4658">one out before the watch party.</text>

    <text x="32" y="470" font-size="12.5" fill="#8a97a8">smallest-commit framing, on purpose</text>
  </g>
  <text x="1010" y="775" text-anchor="middle" font-size="15.5" font-weight="600" fill="#0f1b2d">Tasks ranked by energy</text>
  <text x="1010" y="797" text-anchor="middle" font-size="13.5" fill="#5b6b80">ADHD-first, not a wall of to-dos</text>

  <text x="620" y="838" text-anchor="middle" font-size="12.5" fill="#9aa7b8">Designed from real production output · github.com/sebastianmukuria/daily-os-bot</text>
</svg>
