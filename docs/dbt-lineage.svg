<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 540" font-family="Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="1138" height="538" rx="14" fill="#0d1117" stroke="#30363d"/>

  <text x="28" y="40" fill="#e6edf3" font-size="21" font-weight="700">dbt lineage — RAW → staging → marts</text>
  <text x="28" y="63" fill="#8b949e" font-size="13">Every model version-controlled, tested (unique / not_null / accepted_values / relationships), and documented.</text>

  <!-- column headers -->
  <g fill="#6e7681" font-size="12" font-weight="700" text-anchor="middle">
    <text x="120" y="92">RAW (source)</text>
    <text x="352" y="92">STAGING</text>
    <text x="657" y="92">FACTS</text>
    <text x="960" y="92">MART</text>
  </g>

  <!-- edges -->
  <g stroke="#6e7681" stroke-width="1.5" fill="none" opacity="0.7">
    <!-- RAW -> each staging -->
    <line x1="210" y1="302" x2="250" y2="132"/>
    <line x1="210" y1="302" x2="250" y2="190"/>
    <line x1="210" y1="302" x2="250" y2="248"/>
    <line x1="210" y1="302" x2="250" y2="306"/>
    <line x1="210" y1="302" x2="250" y2="364"/>
    <line x1="210" y1="302" x2="250" y2="422"/>
    <line x1="210" y1="302" x2="250" y2="480"/>
    <!-- staging -> facts -->
    <line x1="450" y1="132" x2="560" y2="152"/>
    <line x1="450" y1="190" x2="560" y2="220"/>
    <line x1="450" y1="248" x2="560" y2="288"/>
    <line x1="450" y1="306" x2="560" y2="346"/>
    <!-- facts -> mart_funnel -->
    <line x1="750" y1="152" x2="860" y2="198" stroke="#f4b548" opacity="0.9"/>
    <line x1="750" y1="220" x2="860" y2="198" stroke="#f4b548" opacity="0.9"/>
  </g>

  <!-- RAW -->
  <rect x="30" y="270" width="180" height="64" rx="8" fill="#161b22" stroke="#30363d"/>
  <rect x="30" y="270" width="4" height="64" fill="#29b5e8"/>
  <text x="120" y="299" fill="#29b5e8" font-size="12.5" font-weight="700" text-anchor="middle">RAW.NOTION_PAGES</text>
  <text x="120" y="317" fill="#8b949e" font-size="11" text-anchor="middle">VARIANT JSON</text>

  <!-- staging -->
  <g>
    <g><rect x="250" y="112" width="200" height="40" rx="7" fill="#161b22" stroke="#30363d"/><rect x="250" y="112" width="4" height="40" fill="#ff694b"/><text x="356" y="137" fill="#e6edf3" font-size="12.5" text-anchor="middle">stg_applications</text></g>
    <g><rect x="250" y="170" width="200" height="40" rx="7" fill="#161b22" stroke="#30363d"/><rect x="250" y="170" width="4" height="40" fill="#ff694b"/><text x="356" y="195" fill="#e6edf3" font-size="12.5" text-anchor="middle">stg_pipeline_events</text></g>
    <g><rect x="250" y="228" width="200" height="40" rx="7" fill="#161b22" stroke="#30363d"/><rect x="250" y="228" width="4" height="40" fill="#ff694b"/><text x="356" y="253" fill="#e6edf3" font-size="12.5" text-anchor="middle">stg_tasks</text></g>
    <g><rect x="250" y="286" width="200" height="40" rx="7" fill="#161b22" stroke="#30363d"/><rect x="250" y="286" width="4" height="40" fill="#ff694b"/><text x="356" y="311" fill="#e6edf3" font-size="12.5" text-anchor="middle">stg_habits</text></g>
    <g><rect x="250" y="344" width="200" height="40" rx="7" fill="#13171d" stroke="#21262d"/><rect x="250" y="344" width="4" height="40" fill="#6e3b30"/><text x="356" y="369" fill="#6e7681" font-size="12.5" text-anchor="middle">stg_projects</text></g>
    <g><rect x="250" y="402" width="200" height="40" rx="7" fill="#13171d" stroke="#21262d"/><rect x="250" y="402" width="4" height="40" fill="#6e3b30"/><text x="356" y="427" fill="#6e7681" font-size="12.5" text-anchor="middle">stg_ideas</text></g>
    <g><rect x="250" y="460" width="200" height="40" rx="7" fill="#13171d" stroke="#21262d"/><rect x="250" y="460" width="4" height="40" fill="#6e3b30"/><text x="356" y="485" fill="#6e7681" font-size="12.5" text-anchor="middle">stg_reading</text></g>
  </g>

  <!-- facts -->
  <g>
    <g><rect x="560" y="132" width="190" height="40" rx="7" fill="#161b22" stroke="#30363d"/><rect x="560" y="132" width="4" height="40" fill="#ff694b"/><text x="657" y="157" fill="#e6edf3" font-size="12.5" text-anchor="middle">fct_applications</text></g>
    <g><rect x="560" y="200" width="190" height="40" rx="7" fill="#161b22" stroke="#30363d"/><rect x="560" y="200" width="4" height="40" fill="#ff694b"/><text x="657" y="225" fill="#e6edf3" font-size="12.5" text-anchor="middle">fct_pipeline_events</text></g>
    <g><rect x="560" y="268" width="190" height="40" rx="7" fill="#161b22" stroke="#30363d"/><rect x="560" y="268" width="4" height="40" fill="#ff694b"/><text x="657" y="293" fill="#e6edf3" font-size="12.5" text-anchor="middle">fct_tasks</text></g>
    <g><rect x="560" y="326" width="190" height="40" rx="7" fill="#161b22" stroke="#30363d"/><rect x="560" y="326" width="4" height="40" fill="#ff694b"/><text x="657" y="351" fill="#e6edf3" font-size="12.5" text-anchor="middle">fct_habits</text></g>
  </g>

  <!-- mart -->
  <rect x="860" y="170" width="200" height="56" rx="9" fill="#20283a" stroke="#f4b548" stroke-width="2"/>
  <text x="960" y="196" fill="#f4b548" font-size="14.5" font-weight="700" text-anchor="middle">mart_funnel</text>
  <text x="960" y="215" fill="#c9b079" font-size="10.5" text-anchor="middle">stage conversion · headline</text>

  <text x="250" y="522" fill="#6e7681" font-size="11">stg_projects / stg_ideas / stg_reading: staged only (no mart yet)</text>
</svg>
