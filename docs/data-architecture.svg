<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 380" font-family="Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="1178" height="378" rx="14" fill="#0d1117" stroke="#30363d"/>

  <text x="28" y="44" fill="#e6edf3" font-size="21" font-weight="700">Analytics pipeline — ELT</text>
  <text x="28" y="68" fill="#8b949e" font-size="13">Operational truth in Notion; analytics modeled in Snowflake with version-controlled, tested SQL.</text>

  <!-- orchestration bar -->
  <rect x="260" y="104" width="888" height="28" rx="14" fill="#10243b" stroke="#1f6feb"/>
  <text x="704" y="123" fill="#79c0ff" font-size="12.5" font-weight="600" text-anchor="middle">GitHub Actions  -  daily:  el_notion.py  →  dbt build  (Snowflake key-pair auth)</text>

  <!-- connectors -->
  <g stroke="#8b949e" stroke-width="2" fill="#8b949e">
    <line x1="206" y1="205" x2="250" y2="205"/><polygon points="250,200 258,205 250,210"/>
    <line x1="442" y1="205" x2="486" y2="205"/><polygon points="486,200 494,205 486,210"/>
    <line x1="678" y1="205" x2="722" y2="205"/><polygon points="722,200 730,205 722,210"/>
    <line x1="914" y1="205" x2="958" y2="205"/><polygon points="958,200 966,205 958,210"/>
  </g>

  <!-- cards -->
  <g>
    <!-- Notion -->
    <rect x="24" y="150" width="180" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="24" y="150" width="180" height="4" rx="2" fill="#f0f6fc"/>
    <text x="114" y="184" fill="#f0f6fc" font-size="15" font-weight="700" text-anchor="middle">Notion</text>
    <text x="114" y="206" fill="#8b949e" font-size="11" text-anchor="middle">7 operational DBs</text>
    <text x="114" y="224" fill="#8b949e" font-size="11" text-anchor="middle">tasks · habits · journal</text>
    <text x="114" y="240" fill="#8b949e" font-size="11" text-anchor="middle">pipeline · ideas · reading</text>

    <!-- Snowflake RAW -->
    <rect x="260" y="150" width="180" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="260" y="150" width="180" height="4" rx="2" fill="#29b5e8"/>
    <text x="350" y="184" fill="#29b5e8" font-size="15" font-weight="700" text-anchor="middle">Snowflake · RAW</text>
    <text x="350" y="206" fill="#8b949e" font-size="11" text-anchor="middle">NOTION_PAGES</text>
    <text x="350" y="224" fill="#8b949e" font-size="11" text-anchor="middle">every page as</text>
    <text x="350" y="240" fill="#8b949e" font-size="11" text-anchor="middle">VARIANT JSON</text>

    <!-- dbt staging -->
    <rect x="496" y="150" width="180" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="496" y="150" width="180" height="4" rx="2" fill="#ff694b"/>
    <text x="586" y="184" fill="#ff694b" font-size="15" font-weight="700" text-anchor="middle">dbt · staging</text>
    <text x="586" y="206" fill="#8b949e" font-size="11" text-anchor="middle">7× stg_ models</text>
    <text x="586" y="224" fill="#8b949e" font-size="11" text-anchor="middle">cast + rename;</text>
    <text x="586" y="240" fill="#8b949e" font-size="11" text-anchor="middle">strip_emoji macro</text>

    <!-- dbt marts -->
    <rect x="732" y="150" width="180" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="732" y="150" width="180" height="4" rx="2" fill="#ff694b"/>
    <text x="822" y="184" fill="#ff694b" font-size="15" font-weight="700" text-anchor="middle">dbt · marts</text>
    <text x="822" y="206" fill="#8b949e" font-size="11" text-anchor="middle">fct_* + mart_funnel</text>
    <text x="822" y="224" fill="#8b949e" font-size="11" text-anchor="middle">tests + column docs</text>
    <text x="822" y="240" fill="#8b949e" font-size="11" text-anchor="middle">stage conversion</text>

    <!-- Evidence -->
    <rect x="968" y="150" width="180" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="968" y="150" width="180" height="4" rx="2" fill="#a78bfa"/>
    <text x="1058" y="184" fill="#a78bfa" font-size="15" font-weight="700" text-anchor="middle">Evidence</text>
    <text x="1058" y="206" fill="#8b949e" font-size="11" text-anchor="middle">BI-as-code</text>
    <text x="1058" y="224" fill="#8b949e" font-size="11" text-anchor="middle">static-site dashboard</text>
    <text x="1058" y="240" fill="#8b949e" font-size="11" text-anchor="middle">funnel + conversion</text>
  </g>

  <text x="28" y="320" fill="#6e7681" font-size="11.5">Schema-agnostic loader (VARIANT) — all typing happens in dbt. Demo dashboard ships on synthetic data; the same project points at live Snowflake locally.</text>
  <text x="28" y="340" fill="#6e7681" font-size="11.5">A separate Pipeline Events transition log powers the funnel mart (applications reaching each stage, time-in-stage).</text>
</svg>
