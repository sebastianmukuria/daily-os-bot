name: Pipeline tests

# Runs the deterministic pipeline tests (classifier prefilter + state machine)
# on PRs that touch them. No API key needed — the LLM pass is skipped in CI.
on:
  pull_request:
    paths:
      - "pipeline_classifier.py"
      - "pipeline_state.py"
      - "pipeline_ingest.py"
      - "pipeline_backfill.py"
      - "pipeline_interviews.py"
      - "briefings.py"
      - "inbox_events.py"
      - "fixtures/**"
      - "test_classifier.py"
      - "test_pipeline_state.py"
      - "test_pipeline_ingest.py"
      - "test_pipeline_backfill.py"
      - "test_pipeline_interviews.py"
      - "test_briefings.py"
      - "test_inbox_events.py"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Classifier prefilter eval
        run: python3 test_classifier.py
      - name: State machine tests
        run: python3 test_pipeline_state.py
      - name: Ingest planner tests
        run: python3 test_pipeline_ingest.py
      - name: Backfill tests
        run: python3 test_pipeline_backfill.py
      - name: Interview-watch tests
        run: python3 test_pipeline_interviews.py
      - name: Briefing formatter tests
        run: python3 test_briefings.py
      - name: Inbox-event helper tests
        run: python3 test_inbox_events.py
