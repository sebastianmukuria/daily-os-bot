name: Classifier eval

# Runs the deterministic prefilter eval whenever the classifier, its prompts, or
# the fixtures change. No API key needed — the LLM pass is skipped in CI.
on:
  pull_request:
    paths:
      - "pipeline_classifier.py"
      - "fixtures/**"
      - "test_classifier.py"
  workflow_dispatch:

jobs:
  prefilter-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run prefilter eval
        run: python3 test_classifier.py
