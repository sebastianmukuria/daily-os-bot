name: Warehouse refresh

# Daily: snapshot Notion into Snowflake RAW, then run dbt (build + test the marts).
# Secrets live in the repo's Actions secrets — nothing sensitive in the repo.
on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC ≈ 7am ET
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install warehouse deps
        run: pip install -r requirements-warehouse.txt
      - name: EL — Notion → Snowflake RAW
        run: python3 el_notion.py
      - name: dbt build (models + tests)
        working-directory: dbt
        run: dbt build --profiles-dir .
