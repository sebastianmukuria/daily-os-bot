version: 2

sources:
  - name: notion
    description: "Raw landed Notion data, loaded by el_notion.py."
    database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
    schema: RAW
    tables:
      - name: notion_pages
        description: >
          One row per Notion page across all databases. `source` discriminates
          which database; `properties` is the page's raw Notion properties as a
          VARIANT. Full-refreshed each EL run.
        columns:
          - name: page_id
            description: "Notion page UUID (grain)."
            tests:
              - not_null
          - name: source
            tests:
              - accepted_values:
                  arguments:
                    values: ['tasks', 'projects', 'ideas', 'reading', 'habits', 'job_pipeline', 'pipeline_events']
