version: 2

models:
  - name: stg_tasks
    description: "One row per task, typed from RAW. Status/energy emoji-stripped."
    columns:
      - name: task_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['Not Started', 'In Progress', 'Done', 'Blocked']
              config: {severity: warn}
      - name: energy
        tests:
          - accepted_values:
              arguments:
                values: ['High', 'Medium', 'Low']
              config: {severity: warn}

  - name: stg_projects
    description: "One row per project."
    columns:
      - name: project_id
        tests: [unique, not_null]

  - name: stg_ideas
    description: "One row per idea."
    columns:
      - name: idea_id
        tests: [unique, not_null]

  - name: stg_reading
    description: "One row per reading-list item."
    columns:
      - name: reading_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['Want to read', 'Reading', 'Done']
              config: {severity: warn}

  - name: stg_habits
    description: "One row per habit, with current streak."
    columns:
      - name: habit_id
        tests: [unique, not_null]

  - name: stg_applications
    description: "One row per job application (per role)."
    columns:
      - name: application_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['Applied', 'Recruiter Screen', 'Interviewing', 'Final Round', 'Offer', 'Rejected', 'Withdrawn', 'Ghosted']
              config: {severity: warn}

  - name: stg_pipeline_events
    description: "One row per status-transition event in the application funnel."
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: application_id
        description: "FK to stg_applications. Warn-only: an event can outlive a deleted application."
        tests:
          - relationships:
              arguments:
                to: ref('stg_applications')
                field: application_id
              config: {severity: warn}
